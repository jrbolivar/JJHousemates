<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <rect width="1200" height="400" fill="#ffffff"/>
  <g transform="translate(40 40) scale(0.625)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ee59d"/>
      <stop offset="1" stop-color="#0b8bd9"/>
    </linearGradient>
    <g id="foot">
      <!-- sole: forefoot + heel joined by an arch -->
      <path d="M0 -40 C 26 -40 34 -14 30 8 C 27 26 18 36 16 52 C 14 70 12 86 -2 88 C -18 90 -22 74 -20 58 C -18 40 -24 26 -28 8 C -34 -16 -24 -40 0 -40 Z"/>
      <circle cx="-22" cy="-56" r="11"/>
      <circle cx="-2"  cy="-64" r="9.5"/>
      <circle cx="15"  cy="-60" r="8"/>
      <circle cx="28"  cy="-50" r="6.5"/>
      <circle cx="36"  cy="-37" r="5.5"/>
    </g>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- two friends' footprints walking side by side -->
  <g fill="#ffffff" opacity="0.7" transform="translate(170 296) rotate(-14) scale(1.15)">
    <use href="#foot" transform="scale(-1 1)"/>
  </g>
  <g fill="#ffffff" transform="translate(322 222) rotate(14) scale(1.15)">
    <use href="#foot"/>
  </g>
  <!-- small heart: walking together -->
  <path fill="#ffffff" transform="translate(394 380) scale(1.3)"
        d="M0 10 C -14 0 -20 -6 -20 -14 C -20 -22 -12 -26 -6 -22 C -3 -20 -1 -18 0 -16 C 1 -18 3 -20 6 -22 C 12 -26 20 -22 20 -14 C 20 -6 14 0 0 10 Z"/>
</g>
  <text x="400" y="225" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="150" font-weight="800" fill="#0f2a3d" letter-spacing="-4">Step<tspan fill="#11b5a4">Mates</tspan></text>
  <text x="406" y="295" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" fill="#5b7184">Walk together. Count together.</text>
</svg>
